name: Deploy Pig Racing to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'prototype/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # Required one-time repo setting:
      # Settings > Pages > Build and deployment > Source = GitHub Actions
      # A default GITHUB_TOKEN cannot enable a Pages site automatically.
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
