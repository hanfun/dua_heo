name: Deploy Pig Racing to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site/**'
      - 'server/**'
      - 'prototype/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # Required one-time repo setting:
      # Settings > Pages > Build and deployment > Source = GitHub Actions
      # A default GITHUB_TOKEN cannot enable a Pages site automatically.
      - name: Validate JavaScript and game challenge modes
        run: |
          node site/smoke-test.cjs
          node site/score-test.cjs
          node server/server-test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website includes Top 10 build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Published URL: ${PAGE_URL}" >> "${GITHUB_STEP_SUMMARY}"
          SITE="${PAGE_URL%/}/"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --retry 1 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}?build=${GITHUB_SHA:0:8}" -o /tmp/duaheo-live-index.html && grep -q 'content="2026-11-21-top10-r2"' /tmp/duaheo-live-index.html && grep -q 'id="playerNameInput"' /tmp/duaheo-live-index.html; then
              ok=1
              break
            fi
            echo "Published page not updated (attempt ${attempt}/8)"
            sleep 8
          done
          test "${ok}" -eq 1
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${SITE}site/leaderboard.js?build=${GITHUB_SHA:0:8}" -o /tmp/duaheo-live-leaderboard.js
          grep -q 'PigScores' /tmp/duaheo-live-leaderboard.js
          echo "✅ Live Pages URL serves the latest Top 10 build" >> "${GITHUB_STEP_SUMMARY}"
